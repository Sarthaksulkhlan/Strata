<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">STRATA frontend and aggregate API system architecture</title>
  <desc id="desc">A system architecture diagram of the browser frontend, Vite development server, typed API client, CORS boundary, FastAPI aggregate API, and reviewed aggregate snapshot.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#0A1128}.h{font:700 18px Arial,sans-serif;fill:#0A1128}.b{font:14px Arial,sans-serif;fill:#334155}.m{font:600 11px monospace;letter-spacing:.08em;fill:#1D4ED8}.box{fill:#F7F4EE;stroke:#0A1128;stroke-opacity:.18;stroke-width:1.5}.api{fill:#EAF1FF;stroke:#1D4ED8;stroke-width:2}.data{fill:#0A1128}.line{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#1D4ED8;stroke-width:1.5;stroke-dasharray:6 6}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8Z" fill="#64748B"/></marker></defs>
  <rect width="1400" height="640" rx="24" fill="#F7F4EE"/>
  <text x="60" y="64" class="m">STRATA / SYSTEM ARCHITECTURE</text><text x="60" y="104" class="title">A browser-only interface over a protected aggregate-evidence boundary</text>
  <rect x="60" y="156" width="365" height="355" rx="20" class="box"/><text x="88" y="196" class="m">PUBLIC FRONTEND REPOSITORY</text><text x="88" y="232" class="h">Browser + Vite application</text>
  <rect x="88" y="262" width="309" height="72" rx="12" class="box"/><text x="108" y="290" class="h">React presentation layer</text><text x="108" y="314" class="b">Narrative canvas, navigation and states</text>
  <rect x="88" y="355" width="309" height="112" rx="12" class="api"/><text x="108" y="384" class="h">Typed API client</text><text x="108" y="408" class="b">src/api/clutchiq.ts</text><text x="108" y="432" class="b">Rankings + methodology only</text><text x="108" y="451" class="m">VITE_API_BASE_URL</text>
  <rect x="520" y="203" width="360" height="258" rx="20" class="api"/><text x="550" y="243" class="m">LOCAL BACKEND WORKSPACE</text><text x="550" y="279" class="h">ClutchIQ Aggregate API</text><text x="550" y="306" class="b">FastAPI, read-only endpoints, explicit CORS</text>
  <rect x="550" y="337" width="300" height="82" rx="12" class="box"/><text x="570" y="366" class="h">Publication controls</text><text x="570" y="390" class="b">No raw records, paths or private files</text>
  <rect x="975" y="156" width="365" height="355" rx="20" class="data"/><text x="1004" y="196" class="m" fill="#93C5FD">REVIEWED OUTPUT BOUNDARY</text><text x="1004" y="232" class="h" fill="#F7F4EE">Phase 7A aggregate snapshot</text>
  <rect x="1004" y="262" width="307" height="83" rx="12" fill="#16213F" stroke="#3B82F6"/><text x="1024" y="290" class="h" fill="#F7F4EE">Reviewed rankings</text><text x="1024" y="315" class="b" fill="#CBD5E1">Batting, bowling and evidence labels</text>
  <rect x="1004" y="367" width="307" height="100" rx="12" fill="#16213F" stroke="#3B82F6"/><text x="1024" y="395" class="h" fill="#F7F4EE">Methodology metadata</text><text x="1024" y="420" class="b" fill="#CBD5E1">Definitions, sensitivity and limitations</text><text x="1024" y="444" class="m" fill="#93C5FD">RAW SOURCE DATA EXCLUDED</text>
  <path d="M425 411H520" class="line"/><text x="433" y="390" class="m">HTTPS / JSON</text><path d="M880 332H975" class="line"/><text x="891" y="312" class="m">READ ONLY</text>
  <path d="M242 334V355" class="dash"/><text x="88" y="562" class="b">The frontend can render loading, empty and error states. Match Lab and auction intelligence remain unavailable because no approved aggregate output supports them.</text>
</svg>
