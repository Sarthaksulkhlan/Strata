<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">STRATA frontend aggregate evidence flow</title>
  <desc id="desc">An animated architectural diagram showing the browser frontend requesting reviewed aggregate evidence from the local ClutchIQ API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#F7F4EE"/><stop offset="1" stop-color="#E8EEF9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1128" flood-opacity=".12"/></filter>
    <style>
      .heading{font:700 18px Arial,sans-serif;fill:#0A1128}.body{font:14px Arial,sans-serif;fill:#334155}.mono{font:600 12px monospace;letter-spacing:.08em;fill:#1D4ED8}.wire{fill:none;stroke:#94A3B8;stroke-width:2;stroke-dasharray:7 8}.node{fill:#F7F4EE;stroke:#0A1128;stroke-opacity:.18;stroke-width:1.5}.blue{fill:#1D4ED8}.packet{fill:#1D4ED8;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="mono">STRATA / READ-ONLY EVIDENCE DELIVERY</text>
  <text x="54" y="92" class="heading" style="font-size:28px">From reviewed aggregate output to the browser</text>
  <path d="M310 235H454M746 235H890" class="wire"/>
  <g filter="url(#shadow)"><rect x="54" y="153" width="256" height="164" rx="18" class="node"/><rect x="454" y="128" width="292" height="214" rx="18" class="node"/><rect x="890" y="153" width="256" height="164" rx="18" class="node"/></g>
  <circle cx="88" cy="190" r="15" class="blue"/><text x="113" y="188" class="heading">Browser</text><text x="113" y="212" class="body">Vite / React UI</text><text x="78" y="258" class="mono">RANKINGS + METHOD</text><text x="78" y="282" class="body">Typed response rendering</text>
  <circle cx="488" cy="165" r="15" class="blue"/><text x="513" y="163" class="heading">Frontend integration layer</text><text x="513" y="187" class="body">src/api/clutchiq.ts</text><text x="478" y="230" class="mono">GET /api/v1</text><text x="478" y="254" class="body">CORS-restricted requests</text><text x="478" y="294" class="body">Loading, empty and error states</text>
  <circle cx="924" cy="190" r="15" class="blue"/><text x="949" y="188" class="heading">ClutchIQ Aggregate API</text><text x="949" y="212" class="body">Read-only FastAPI service</text><text x="914" y="258" class="mono">PHASE 7A / 7B</text><text x="914" y="282" class="body">Reviewed aggregate evidence</text>
  <circle r="7" class="packet"><animateMotion dur="3.4s" repeatCount="indefinite" path="M310 235H454"/></circle><circle r="7" class="packet"><animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M746 235H890"/></circle>
  <text x="54" y="385" class="body">Animated system-flow illustration. It represents public aggregate API traffic only; raw datasets and source records do not enter the browser.</text>
</svg>
