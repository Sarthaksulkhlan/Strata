name: Backend verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python backend/tests/check_publication.py
      - run: pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend/integration_api
      - run: python -m unittest discover -s backend/tests -q
